<style>
:root{--bg:#f3f4f8;--panel:#fff;--panel2:#eff1f7;--ink:#161a23;--mute:#667085;--brass:#5b4be8;--ok:#0e9f77;--line:#e3e6ee;--on:#fff;--grad:linear-gradient(135deg,#5b4be8,#8b4fe6);--shadow:0 1px 2px rgba(16,24,40,.06),0 10px 28px rgba(16,24,40,.07);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1017;--panel:#161a23;--panel2:#1e2430;--ink:#eceff5;--mute:#8a93a6;--brass:#9a8fff;--ok:#38d6a7;--line:#272d3a;--on:#0d1017;--grad:linear-gradient(135deg,#9a8fff,#c19bff);--shadow:0 10px 30px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1017;--panel:#161a23;--panel2:#1e2430;--ink:#eceff5;--mute:#8a93a6;--brass:#9a8fff;--ok:#38d6a7;--line:#272d3a;--on:#0d1017;--grad:linear-gradient(135deg,#9a8fff,#c19bff);--shadow:0 10px 30px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.6rem;margin:0 0 14px;letter-spacing:-.02em}
nav{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:18px}
nav button{flex:1;padding:9px 4px;border:0;border-radius:9px;background:none;color:var(--mute);font:inherit;font-size:.92rem;cursor:pointer}
nav button[aria-selected="true"]{background:var(--brass);color:var(--on);font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
section{display:none;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
section.on{display:block}
.big{font-size:4.6rem;font-weight:700;line-height:1;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.sub{text-align:center;color:var(--mute);margin:4px 0 14px}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin:12px 0}
.btn{padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.btn.main{background:var(--brass);border-color:var(--brass);color:var(--on);font-weight:700;min-width:130px}
.btn.sm{padding:6px 12px;font-size:.9rem}
input[type=range]{width:100%;accent-color:var(--brass)}
input,select{font:inherit;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
label{color:var(--mute);font-size:.9rem}
/* pendulum */
.stage{height:150px;position:relative;margin:0 auto 6px;width:200px}
#arm{position:absolute;left:50%;bottom:6px;width:6px;height:130px;margin-left:-3px;background:var(--ink);border-radius:3px;transform-origin:50% 100%;transform:rotate(-24deg);transition:transform .5s ease-in-out}
#arm::before{content:"";position:absolute;top:22px;left:-11px;width:28px;height:20px;background:var(--brass);border-radius:5px}
.base{position:absolute;left:50%;bottom:0;width:110px;height:12px;margin-left:-55px;background:var(--line);border-radius:6px}
.dots{display:flex;gap:8px;justify-content:center;margin:8px 0 14px}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--line)}
.dots i.hit{background:var(--brass)}
.dots i.acc.hit{background:var(--ok)}
/* tuner */
/* timer */
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.chips .btn[aria-pressed="true"]{border-color:var(--brass);color:var(--brass);font-weight:700}
/* library */
.song{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.song .t{flex:1;min-width:0}
.song b{display:block;overflow-wrap:anywhere}
.song small{color:var(--mute)}
.st{border-radius:99px;font-size:.8rem;padding:3px 10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;font-family:inherit}
.st.siap{border-color:var(--ok);color:var(--ok)}
.st.latihan{border-color:var(--brass);color:var(--brass)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.form .w{grid-column:1/-1}
.empty{color:var(--mute);text-align:center;padding:16px 0}
.err{color:var(--brass);text-align:center;min-height:1.5em}
nav{overflow-x:auto}
nav button{white-space:nowrap;padding:9px 10px}
textarea{font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-height:90px}
pre.chart{font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border-radius:10px;padding:12px;margin:0 0 8px;color:var(--ink)}
.chartbox{padding:0 0 12px;border-bottom:1px solid var(--line)}
.cdiag{display:block;margin:0 auto;color:var(--ink)}
.song>span{color:var(--mute);min-width:1.4em}
pre.chart .cl{color:var(--brass);font-weight:700}
pre.chart .sec{display:inline-block;background:var(--brass);color:var(--on);font:700 .85em 'Bricolage Grotesque',system-ui,sans-serif;padding:1px 9px;border-radius:5px;margin:8px 0 3px}
.btn[aria-pressed="true"]{border-color:var(--brass);color:var(--brass);font-weight:700}
.btn:disabled{opacity:.4;cursor:default}
#pv{position:fixed;inset:0;z-index:50;background:var(--bg);color:var(--ink);overflow-y:auto}
#pvbar{position:sticky;top:0;z-index:2;background:var(--panel);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px}
#pvpre{background:none;max-width:900px;margin:0 auto;padding:16px 16px 60vh}
/* tampilan modern */
body{background:#14110e}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:transparent;z-index:4}
h1{color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.55)}
.acct{color:rgba(255,255,255,.85);text-shadow:0 1px 8px rgba(0,0,0,.5)}
main{max-width:600px}
h1{font-size:1.9rem;letter-spacing:-.035em;margin:6px 0 16px}
h1::before{content:"";display:inline-block;width:.5em;height:.5em;border-radius:50%;background:var(--grad);margin-right:.45em;vertical-align:.08em}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--panel) 85%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:999px;padding:5px;box-shadow:var(--shadow);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border-radius:999px;padding:9px 15px;font-weight:500;transition:background .2s,color .2s}
nav button[aria-selected="true"]{background:var(--grad);color:var(--on);font-weight:700;box-shadow:0 4px 14px color-mix(in srgb,var(--brass) 40%,transparent)}
section{border-radius:26px;padding:24px;box-shadow:var(--shadow)}
section.on{animation:slin .46s cubic-bezier(.22,1,.36,1) both}
section.out{display:block;animation:slout .16s cubic-bezier(.4,0,1,1) both;pointer-events:none}
section.on>*{animation:kid .5s cubic-bezier(.22,1,.36,1) both}
section.on>*:nth-child(1){animation-delay:.04s}section.on>*:nth-child(2){animation-delay:.08s}section.on>*:nth-child(3){animation-delay:.12s}section.on>*:nth-child(4){animation-delay:.16s}section.on>*:nth-child(5){animation-delay:.2s}section.on>*:nth-child(n+6){animation-delay:.24s}
@keyframes kid{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
nav{position:sticky;scroll-behavior:smooth}
nav button{position:relative;z-index:1}
nav button[aria-selected="true"]{background:none!important;box-shadow:none!important}
#pill{position:absolute;top:5px;bottom:5px;left:0;width:0;border-radius:999px;background:var(--grad);box-shadow:0 4px 14px color-mix(in srgb,var(--brass) 40%,transparent);z-index:0;pointer-events:none;transition:transform .5s cubic-bezier(.34,1.3,.5,1),width .5s cubic-bezier(.34,1.3,.5,1)}
#pill.nt{transition:none}
nav button:active{transform:scale(.94)}
nav button{transition:background .2s,color .25s,transform .15s}
.btn{border-radius:999px;background:var(--panel2);border:1px solid transparent;padding:10px 18px;font-weight:500;transition:transform .12s,background .2s}
.btn:active{transform:scale(.96)}
.btn.sm{padding:6px 13px}
.song .btn,.chartbox .btn,.st{background:var(--panel)}
.btn[aria-pressed="true"]{background:color-mix(in srgb,var(--brass) 16%,var(--panel));border-color:color-mix(in srgb,var(--brass) 55%,transparent)}
.btn.main{background:var(--grad);color:var(--on);border-color:transparent;box-shadow:0 6px 18px color-mix(in srgb,var(--brass) 35%,transparent)}
input,select,textarea{background:var(--panel2);border:1px solid transparent;border-radius:12px}
input:focus,select:focus,textarea:focus{border-color:var(--brass)}
input[type=range]{background:none;border:0;padding:0}
.big{font-size:5rem;letter-spacing:-.045em}
.dots i{width:14px;height:14px;background:var(--panel2)}
.dots i.hit{box-shadow:0 0 12px var(--brass)}
.dots i.acc.hit{box-shadow:0 0 12px var(--ok)}
#arm::before{background:var(--grad);border-radius:8px}
.base{background:var(--panel2)}
.song{background:var(--panel2);border:0;border-radius:18px;padding:12px 14px;margin-bottom:8px}
.chartbox{background:var(--panel2);border:0;border-radius:18px;padding:14px;margin:-2px 0 10px}
.chartbox textarea,pre.chart{background:var(--panel)}
.song{flex-wrap:wrap}
.song .t{flex:1 1 130px}
#pvpre{background:none}
pre.chart .u{break-inside:avoid}
pre.chart .u.h{break-after:avoid}
pre.chart .gp{height:.75em;break-inside:avoid}
@media (min-width:980px){main:has(#perpustakaan.on pre.c2){max-width:1040px}}
/* tuner 3D */
.tplate{position:relative;margin:6px auto 14px;padding:16px 14px 18px;border-radius:30px;color:#eceff5;background:radial-gradient(120% 90% at 50% 0%,#2b3253 0%,#161b2c 55%,#0c1018 100%);box-shadow:0 34px 50px -22px rgba(0,0,0,.65),0 2px 0 rgba(255,255,255,.14) inset,0 -12px 26px rgba(0,0,0,.5) inset,0 0 0 1px rgba(255,255,255,.07);transform:perspective(900px) rotateX(calc(var(--rx,10)*1deg)) rotateY(calc(var(--ry,0)*1deg));transform-style:preserve-3d;transition:transform .18s ease-out;will-change:transform}
.tplate::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(160deg,rgba(255,255,255,.15),transparent 36%);pointer-events:none}
.tlamps{display:flex;justify-content:space-between;align-items:center;padding:0 4px;transform:translateZ(18px)}
.lamp{min-width:50px;height:24px;padding:0 8px;border-radius:13px;display:grid;place-items:center;font-size:.85rem;font-weight:700;letter-spacing:.04em;color:#556078;background:linear-gradient(#090c12,#181d2b);box-shadow:inset 0 2px 5px rgba(0,0,0,.75),0 1px 0 rgba(255,255,255,.09);transition:color .15s,background .15s,box-shadow .15s}
.lamp.f.on{color:#06101f;background:linear-gradient(#b4d3ff,#5b95f0);box-shadow:0 0 16px #5b95f0,inset 0 1px 0 rgba(255,255,255,.65)}
.lamp.s.on{color:#210d04;background:linear-gradient(#ffc7a8,#ff8a5c);box-shadow:0 0 16px #ff8a5c,inset 0 1px 0 rgba(255,255,255,.65)}
.lamp.k.on{color:#03150f;background:linear-gradient(#a8ffe4,#38d6a7);box-shadow:0 0 18px #38d6a7,inset 0 1px 0 rgba(255,255,255,.65)}
.tgauge{display:block;width:100%;height:auto;margin-top:-6px;transform:translateZ(30px)}
#ttrack{fill:none;stroke:#080b11;stroke-width:14;stroke-linecap:round;filter:drop-shadow(0 1px 0 rgba(255,255,255,.12))}
.tt{stroke:#667089;stroke-width:2;stroke-linecap:round}.tt.M{stroke:#aab3c8;stroke-width:3}.tt.z{stroke:#38d6a7;stroke-width:4}
.ttl{fill:#7d869b;font:600 11px system-ui,sans-serif;text-anchor:middle}
#ttrail{fill:none;stroke-width:10;stroke-linecap:round}
#ttrail.f{stroke:#6aa8ff;filter:drop-shadow(0 0 7px #6aa8ff)}#ttrail.s{stroke:#ff9460;filter:drop-shadow(0 0 7px #ff9460)}#ttrail.k{stroke:#38d6a7;filter:drop-shadow(0 0 8px #38d6a7)}
#tneedle{transform-origin:200px 200px;transform:rotate(0deg);filter:drop-shadow(0 6px 4px rgba(0,0,0,.6))}
#tneedle polygon{fill:url(#tg-n);transition:fill .2s}#tneedle.ok polygon{fill:#7dffd8}
.tnote{margin-top:-4px;text-align:center;font-weight:700;font-size:5.4rem;line-height:1;letter-spacing:-.03em;color:#f4f6ff;font-variant-numeric:tabular-nums;transform:translateZ(54px);text-shadow:0 1px 0 #b8b2ff,0 2px 0 #a39bff,0 3px 0 #8f85f0,0 4px 0 #7b70dd,0 5px 0 #675cc8,0 6px 0 #5448b0,0 9px 10px rgba(0,0,0,.55),0 16px 30px rgba(0,0,0,.45);transition:color .2s,text-shadow .2s,opacity .3s}
.tnote small{font-size:.36em;margin-left:3px;opacity:.85}.tnote i{font-style:normal;font-size:.5em;vertical-align:.95em;margin-left:1px}
.tnote.ok{color:#eafff7;text-shadow:0 1px 0 #9ff5d8,0 2px 0 #7fe8c4,0 3px 0 #5fd9ae,0 4px 0 #46c298,0 5px 0 #33a982,0 6px 0 #258f6c,0 9px 10px rgba(0,0,0,.55),0 0 30px rgba(56,214,167,.65)}
.tnote.stale{opacity:.45}
.tfreq{margin-top:10px;text-align:center;color:#8a93a6;font-size:.95rem;transform:translateZ(20px)}
.tcents{width:max-content;max-width:100%;margin:2px auto 8px;padding:7px 16px;border-radius:999px;background:var(--panel2);color:var(--mute);text-align:center;font-weight:500;transition:background .2s,color .2s}
.tcents.ok{background:color-mix(in srgb,var(--ok) 22%,var(--panel2));color:var(--ok);font-weight:700}
.btn.main.t3d{min-width:170px;padding:13px 28px;border:0;border-radius:999px;background:var(--grad);color:var(--on);font-size:1.05rem;font-weight:700;box-shadow:0 6px 0 color-mix(in srgb,var(--brass) 50%,#000),0 16px 24px color-mix(in srgb,var(--brass) 35%,transparent),inset 0 2px 0 rgba(255,255,255,.35);transition:transform .1s,box-shadow .1s}
.btn.main.t3d:active{transform:translateY(5px);box-shadow:0 1px 0 color-mix(in srgb,var(--brass) 50%,#000),0 4px 8px color-mix(in srgb,var(--brass) 30%,transparent),inset 0 2px 0 rgba(255,255,255,.35)}
.key{min-width:58px;padding:11px 0;border:0;border-radius:14px;font:inherit;font-weight:700;cursor:pointer;color:var(--ink);background:linear-gradient(180deg,var(--panel2),color-mix(in srgb,var(--panel2) 72%,var(--line)));box-shadow:0 5px 0 var(--line),0 10px 16px rgba(0,0,0,.2);transition:transform .1s,box-shadow .1s,background .15s}
.key:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line),0 3px 6px rgba(0,0,0,.2)}
.key.on{background:var(--grad);color:var(--on);box-shadow:0 5px 0 color-mix(in srgb,var(--brass) 55%,#000),0 0 20px color-mix(in srgb,var(--brass) 55%,transparent)}
@media (prefers-reduced-motion:reduce){.tplate{transition:none}.key,.btn.main.t3d{transition:none}}
@media (min-width:900px){main:has(#scale.on){max-width:860px}}
.fbh{display:flex;align-items:baseline;gap:10px;margin:14px 0 4px;flex-wrap:wrap}.fbh span{color:var(--mute);font-size:.85rem}
.fbscroll{overflow-x:auto;padding-bottom:4px}.fbscroll svg{display:block;min-width:640px;width:100%;height:auto}
.fbf{stroke:var(--line);stroke-width:1.5}.fbn{stroke:var(--ink);stroke-width:4}.fbs{stroke:var(--mute);stroke-linecap:round}.fbi{fill:var(--line)}
.fbl,.fbt{fill:var(--mute);font:600 11px system-ui,sans-serif;text-anchor:middle}

/* ===== Hidup (ringan: hanya transform & opacity) ===== */
#life{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#14110e;contain:paint;--s1:.30;--s2:.55}
#life .bgw{position:absolute;inset:-8%;will-change:transform}
#life .bg{position:absolute;inset:0;background:url(bg.jpg) 70% center/cover no-repeat;animation:kb 60s ease-in-out infinite alternate;will-change:transform}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.08) translate3d(-1.2%,.8%,0)}}
#life .haze{position:absolute;inset:-10%;background:radial-gradient(42% 30% at 22% 32%,rgba(255,196,140,.14),transparent 70%),radial-gradient(36% 26% at 78% 20%,rgba(255,150,110,.11),transparent 70%);animation:hz 32s ease-in-out infinite alternate;will-change:transform}
@keyframes hz{from{transform:translate3d(-3%,0,0)}to{transform:translate3d(4%,-2%,0)}}
#life .shade{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%,transparent 40%,rgba(0,0,0,.4) 100%),linear-gradient(rgba(10,12,20,var(--s1)),rgba(10,12,20,var(--s2)))}
#life .beat{position:absolute;inset:0;opacity:0;background:radial-gradient(65% 55% at 50% 78%,rgba(255,190,120,.5),transparent 70%);pointer-events:none;will-change:opacity}

#fx{position:absolute;inset:0;width:100%;height:100%}

/* tanpa backdrop-filter & tanpa blur: ini yang bikin patah-patah */
section{will-change:auto;background:color-mix(in srgb,var(--panel) 88%,transparent);-webkit-backdrop-filter:none;backdrop-filter:none;border:1px solid color-mix(in srgb,#fff 12%,transparent)}

@keyframes slin{from{opacity:0;transform:translate3d(calc(var(--dir,1)*40px),0,0) scale(.98)}to{opacity:1;transform:none}}

@keyframes rip{to{transform:scale(1);opacity:0}}
@media (hover:hover){.btn:not(.t3d):not(:active):hover{transform:translateY(-2px)}.song{transition:transform .25s cubic-bezier(.22,1,.36,1)}.song:hover{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){#life .bg,#life .haze,h1::before{animation:none!important}#fx,#life .spot{display:none}}

#aerr{min-height:0}
#aerr:empty{display:none}
#aform .fold{overflow:hidden;max-height:96px;transition:max-height .38s cubic-bezier(.22,1,.36,1),opacity .28s,margin .38s,padding .38s,border-width .38s,transform .12s,background .2s,visibility 0s}

<script>
const $=id=>document.getElementById(id);
let onChange=()=>{};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}onChange(k)}};
let ctx;
function audio(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}
function beep(t,f,len,vol){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+len);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+len+.02)}

/* Tab */
const tabs=['metronom','tuner','timer','perpustakaan','tambah','chord','scale','acara'];
let curTab=null,swT=0;
function movePill(n,instant){const b=document.querySelector('nav button[data-t="'+n+'"]'),p=$('pill'),nv=b&&b.parentElement;if(!b)return;if(instant)p.classList.add('nt');p.style.width=b.offsetWidth+'px';p.style.transform='translateX('+b.offsetLeft+'px)';if(instant){p.offsetWidth;p.classList.remove('nt')}try{nv.scrollTo({left:b.offsetLeft-(nv.clientWidth-b.offsetWidth)/2,behavior:instant?'auto':'smooth'})}catch(e){}}
function swap(n){const first=curTab===null,from=curTab,dir=first||from===n?1:(tabs.indexOf(n)>tabs.indexOf(from)?1:-1),el=$(n),old=from&&$(from),tk=++swT;tabs.forEach(t=>{if(t!==n&&t!==from)$(t).classList.remove('on','out')});curTab=n;window.lifeTab&&lifeTab(tabs.indexOf(n));if(first||from===n||matchMedia('(prefers-reduced-motion:reduce)').matches){tabs.forEach(t=>$(t).classList.toggle('on',t===n));return}
old.style.setProperty('--dir',dir);el.style.setProperty('--dir',dir);old.classList.remove('on');old.classList.add('out');setTimeout(()=>{if(tk!==swT)return;old.classList.remove('out');el.classList.remove('on');void el.offsetWidth;el.classList.add('on')},150)}
function show(n){if(!tabs.includes(n))n='metronom';const was=curTab===null;swap(n);document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===n));movePill(n,was);if(n!=='tuner')stopTuner();if(n==='acara')renderEv();if(n==='scale')renderScale()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{location.hash=b.dataset.t});
addEventListener('hashchange',()=>show(location.hash.slice(1)));addEventListener('resize',()=>movePill(curTab,true));addEventListener('load',()=>movePill(curTab,true));if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>movePill(curTab,true));

/* Metronom */
let bpm=100,beats=4,run=false,beat=0,next=0,iv=null,flip=false;
const names=[[60,'Largo'],[76,'Adagio'],[108,'Andante'],[120,'Moderato'],[156,'Allegro'],[200,'Vivace'],[999,'Presto']];
function drawDots(){$('dots').innerHTML=Array.from({length:beats},(_,i)=>'<i class="'+(i===0?'acc':'')+'"></i>').join('')}
function setBpm(v){bpm=Math.max(30,Math.min(240,Math.round(v)));$('bpm').value=bpm;$('bpmv').textContent=bpm;$('tempoName').textContent='BPM · '+names.find(n=>bpm<n[0])[1]}
function flash(b){try{window.lifePulse&&lifePulse(b===0)}catch(e){}const d=$('dots').children;for(const x of d)x.classList.remove('hit');if(d[b])d[b].classList.add('hit');flip=!flip;const a=$('arm');a.style.transitionDuration=(60/bpm)+'s';a.style.transform='rotate('+(flip?24:-24)+'deg)'}
function sched(){while(next<ctx.currentTime+.12){beep(next,beat===0?1400:900,.05,.6);const b=beat;setTimeout(()=>flash(b),Math.max(0,(next-ctx.currentTime)*1000));next+=60/bpm;beat=(beat+1)%beats}}
function mStart(){audio();run=true;beat=0;next=ctx.currentTime+.05;sched();iv=setInterval(sched,25);$('go').textContent='Berhenti'}
function mStop(){run=false;clearInterval(iv);$('go').textContent='Mulai'}
$('go').onclick=()=>run?mStop():mStart();
$('bpm').oninput=e=>setBpm(+e.target.value);
$('m10').onclick=()=>setBpm(bpm-5);$('m1').onclick=()=>setBpm(bpm-1);$('p1').onclick=()=>setBpm(bpm+1);$('p10').onclick=()=>setBpm(bpm+5);
$('beats').onchange=e=>{beats=+e.target.value;beat=0;drawDots()};
let taps=[];
$('tap').onclick=()=>{const n=performance.now();if(taps.length&&n-taps[taps.length-1]>2000)taps=[];taps.push(n);taps=taps.slice(-6);if(taps.length>1){setBpm(60000/((taps[taps.length-1]-taps[0])/(taps.length-1)))}};
drawDots();setBpm(100);

/* Tuner */
const NN=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
let stream,an,tiv,buf;
function pitch(b,sr){const n=b.length;let rms=0;for(let i=0;i<n;i++)rms+=b[i]*b[i];if(Math.sqrt(rms/n)<.012)return -1;
const L=Math.min(n>>1,Math.floor(sr/28)),sq=new Float64Array(n+1),ns=new Float32Array(L);
for(let i=0;i<n;i++)sq[i+1]=sq[i]+b[i]*b[i];
for(let t=0;t<L;t++){let a=0;for(let j=0;j<n-t;j++)a+=b[j]*b[j+t];const m=sq[n-t]+sq[n]-sq[t];ns[t]=m>0?2*a/m:0}
let d=0;while(d<L-1&&ns[d]>0)d++;while(d<L-1&&ns[d]<=0)d++;
let best=-1;const pk=[];for(let t=d+1;t<L-1;t++)if(ns[t]>ns[t-1]&&ns[t]>=ns[t+1]){pk.push(t);if(best<0||ns[t]>ns[best])best=t}
if(best<0||ns[best]<.9)return -1;
const T=pk.find(t=>ns[t]>=.9*ns[best]),x1=ns[T-1],x2=ns[T],x3=ns[T+1],a=(x1+x3-2*x2)/2,bb=(x3-x1)/2;let tt=T;if(a)tt-=bb/(2*a);return sr/tt}
function tick(){an.getFloatTimeDomainData(buf);const f0=pitch(buf,ctx.sampleRate);if(f0<28||f0>1200)return;
const now=performance.now();tH=tH.filter(x=>now-x[0]<900);if(tH.length&&Math.abs(1200*Math.log2(f0/tMed(tH.map(x=>x[1]))))>80)tH=[];tH.push([now,f0]);if(tH.length>5)tH.shift();const f=tMed(tH.map(x=>x[1]));
const a4=+$('a4').value||440,m=69+12*Math.log2(f/a4),r=Math.round(m),cf=(m-r)*100,c=Math.round(cf);
const nm=NN[((r%12)+12)%12],ok=tok=Math.abs(c)<=(tok?7:5);$('note').innerHTML=nm[0]+(nm[1]?'<i>♯</i>':'')+'<small>'+(Math.floor(r/12)-1)+'</small>';$('note').classList.toggle('ok',ok);$('freq').textContent=f.toFixed(1)+' Hz';
tC=cf;tLast=now;tKick();$('lf').classList.toggle('on',c<-5);$('lk').classList.toggle('on',ok);$('ls').classList.toggle('on',c>5);$('tneedle').classList.toggle('ok',ok);$('ttrail').setAttribute('class',ok?'k':c<0?'f':'s');
document.querySelectorAll('#strings .key').forEach(k=>k.classList.toggle('on',+k.dataset.m===r));
$('cents').textContent=Math.abs(c)<=5?'Pas':(c<0?'Terlalu rendah ('+c+' sen): kencangkan':'Terlalu tinggi (+'+c+' sen): kendurkan');$('cents').classList.toggle('ok',ok)}
async function startTuner(){$('terr').textContent='';try{audio();stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
const s=ctx.createMediaStreamSource(stream);an=ctx.createAnalyser();an.fftSize=4096;buf=new Float32Array(an.fftSize);s.connect(an);tiv=setInterval(tick,100);$('tgo').textContent='Berhenti'}
catch(e){$('terr').textContent='Mikrofon tidak bisa diakses. Izinkan akses mikrofon di browser, atau buka halaman ini di tab sendiri.'}}
function stopTuner(){clearInterval(tiv);tiv=null;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('tgo').textContent='Mulai';tH=[];tok=false;tC=0;tKick();['lf','lk','ls'].forEach(i=>$(i).classList.remove('on'));$('tneedle').classList.remove('ok');$('ttrail').setAttribute('class','');$('note').classList.remove('ok');$('cents').classList.remove('ok')}
$('tgo').onclick=()=>stream?stopTuner():startTuner();
/* gauge 3D + string referensi */
let tC=0,cC=0,tLast=0,traf=0,tok=false,tH=[],tins=store.get('rl-tins','bass');
const tMed=a=>{const s=[...a].sort((x,y)=>x-y);return s[s.length>>1]};
const TI={bass:[['E1',41.2],['A1',55],['D2',73.42],['G2',98]],gitar:[['E2',82.41],['A2',110],['D3',146.83],['G3',196],['B3',246.94],['E4',329.63]]};
if(!TI[tins])tins='bass';
function tPol(a,r){const t=a*Math.PI/180;return[200+r*Math.sin(t),200-r*Math.cos(t)]}
function tArc(a0,a1,r){const p=tPol(a0,r),q=tPol(a1,r);return 'M'+p[0].toFixed(1)+' '+p[1].toFixed(1)+'A'+r+' '+r+' 0 0 '+(a1>a0?1:0)+' '+q[0].toFixed(1)+' '+q[1].toFixed(1)}
(()=>{let h='';for(let c=-50;c<=50;c+=5){const M=c%25===0,len=M?20:c%10===0?14:8,p=tPol(c*1.2,134),q=tPol(c*1.2,134-len);h+='<line class="tt'+(c===0?' z':M?' M':'')+'" x1="'+p[0].toFixed(1)+'" y1="'+p[1].toFixed(1)+'" x2="'+q[0].toFixed(1)+'" y2="'+q[1].toFixed(1)+'"/>'}
[-50,-25,0,25,50].forEach(c=>{const p=tPol(c*1.2,174);h+='<text class="ttl" x="'+p[0].toFixed(1)+'" y="'+(p[1]+4).toFixed(1)+'">'+(c>0?'+':'')+c+'</text>'});$('tticks').innerHTML=h})();
function tDraw(c){const a=Math.max(-50,Math.min(50,c))*1.2;$('tneedle').style.transform='rotate('+a.toFixed(2)+'deg)';$('ttrail').setAttribute('d',Math.abs(a)<.5?'':tArc(0,a,150))}
function tLoop(){const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;cC=rm?tC:cC+(tC-cC)*.2;tDraw(cC);$('note').classList.toggle('stale',!!tLast&&!!stream&&performance.now()-tLast>1800);
if(stream||Math.abs(tC-cC)>.05)traf=requestAnimationFrame(tLoop);else{traf=0;tDraw(tC);cC=tC}}
function tKick(){if(!traf)traf=requestAnimationFrame(tLoop)}
const tp=$('tplate');
tp.addEventListener('pointermove',e=>{if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const r=tp.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;tp.style.setProperty('--ry',(x*14).toFixed(1));tp.style.setProperty('--rx',(10-y*14).toFixed(1))});

function scSpell(r,iv){const t=(SC_LET.indexOf(SC_R[r][0])+ +SC_DEG[iv].slice(-1)-1)%7;let d=(((r+iv)%12-SC_NP[t])%12+12)%12;if(d>6)d-=12;return SC_LET[t]+(d>0?'#'.repeat(d):'b'.repeat(-d))}

/* Auto scroll & Presenter */
function setAS(on){asOn=on;asRun++;document.querySelectorAll('[data-a="as"]').forEach(b=>{b.setAttribute('aria-pressed',on);b.textContent=on?'Stop scroll':'Auto scroll'});if(on){asLast=performance.now();asAcc=0;const g=asRun;requestAnimationFrame(t=>asLoop(t,g))}}

requestAnimationFrame(t2=>asLoop(t2,g))}

const keys=KL.map((n,k)=>'<button class="btn sm" data-a="key" data-k="'+k+'" aria-pressed="'+(cu===k)+'">'+n+'</button>').join('');

$('pvpre').className='chart'+(cols2?' c2':'');$('pvpre').style.fontSize=pvFs+'px';$('pvpre').innerHTML=s.x?sheetHtml(s):'Belum ada chord untuk lagu ini.'}

/* Akun & sinkron (Supabase) */
const CFG=window.RL_CONFIG||{};
const sbOn=!!(window.supabase&&/^https?:\/\//.test(CFG.url||'')&&CFG.key&&!/^GANTI/.test(CFG.key));
let sb=null,user=null,applying=false,dirty=false,pushT=null,recBusy=false,amode='login',authBusy=false,chan=null;
const REC=/type=recovery/.test(location.hash);
const LSK=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const setSt=t=>{$('sst').textContent=t};
let lastErr='';
function syncErr(e){lastErr=e&&typeof e==='object'?[e.code,e.message,e.details,e.hint].filter(Boolean).join(' | ')||String(e):String(e);try{console.error('Chordity sync:',e)}catch(_){}setSt(navigator.onLine?'Gagal sinkron':'Offline');$('sst').title=lastErr}
$('sst').style.cursor='pointer';
$('sst').onclick=()=>{if(/^Gagal/.test($('sst').textContent)){alert('Detail error sinkron:\n\n'+(lastErr||'(tidak ada detail)'));reconcile()}};
function snapshot(){const practice={};try{Object.keys(localStorage).filter(k=>k.startsWith('done-')).forEach(k=>practice[k.slice(5)]=store.get(k,0))}catch(e){}
return{songs,events:evs,curEv,practice}}
function wipeLocal(){try{Object.keys(localStorage).filter(k=>k==='songs'||k==='events'||k==='curEv'||k.startsWith('done-')||k.startsWith('rl-')).forEach(k=>localStorage.removeItem(k))}catch(e){}}
function merge(r,l){const byId=(a,b)=>{const m=new Map();[...(b||[]),...(a||[])].forEach(x=>m.set(x.id,x));return[...m.values()]};
const pr={...(l.practice||{})};Object.entries(r.practice||{}).forEach(([k,v])=>pr[k]=Math.max(pr[k]||0,v));
return{songs:byId(r.songs,l.songs),events:byId(r.events,l.events),curEv:r.curEv||l.curEv,practice:pr}}
function applyData(d,ts){applying=true;
songs=Array.isArray(d.songs)?d.songs:[];evs=Array.isArray(d.events)?d.events:[];curEv=d.curEv||0;
Object.entries(d.practice||{}).forEach(([k,v])=>store.set('done-'+k,v));
store.set('songs',songs);store.set('events',evs);store.set('curEv',curEv);store.set('rl-ts',ts||Date.now());
openSong=0;editSong=0;renderSongs();renderEv();showToday();applying=false;dirty=false;setSt('✓ Tersinkron')}
async function pushNow(){clearTimeout(pushT);if(!user)return false;
try{const{error}=await sb.from('user_data').upsert({user_id:user.id,data:snapshot(),client_ts:store.get('rl-ts',Date.now()),updated_at:new Date().toISOString()});
if(error)throw error;dirty=false;setSt('✓ Tersinkron');return true}
catch(e){syncErr(e);return false}}
function isPristine(){let ev=null;try{ev=JSON.parse(LSK('events')||'null')}catch(e){}
const evOk=!ev||!ev.length||(ev.length===1&&ev[0].n==='Acara pertama'&&!ev[0].d&&!(ev[0].s||[]).length);
const noPr=!Object.keys(localStorage).some(k=>k.startsWith('done-'));
return(!LSK('songs')||LSK('songs')===SEED_JSON)&&evOk&&noPr}
async function reconcile(){if(recBusy||!user)return;recBusy=true;
try{const{data:row,error}=await sb.from('user_data').select('data,client_ts').eq('user_id',user.id).maybeSingle();if(error)throw error;
const pristine=isPristine(),lts=store.get('rl-ts',0);
if(!row){if(!lts)store.set('rl-ts',Date.now());await pushNow()}
else if(pristine||(lts&&row.client_ts>lts))applyData(row.data||{},row.client_ts);
else if(!lts){applyData(merge(row.data||{},snapshot()),Date.now());await pushNow()}
else if(row.client_ts<lts)await pushNow();
else{dirty=false;setSt('✓ Tersinkron')}}
catch(e){syncErr(e)}
recBusy=false}
function touch(k){if(!sb||applying||k.startsWith('rl-')||!store.get('rl-owner',''))return;
store.set('rl-ts',Date.now());dirty=true;if(user){setSt('Menyimpan…');clearTimeout(pushT);pushT=setTimeout(pushNow,1500)}else setSt('Offline')}
function subscribe(){if(chan||!user)return;try{chan=sb.channel('ud-'+user.id).on('postgres_changes',{event:'*',schema:'public',table:'user_data',filter:'user_id=eq.'+user.id},()=>{if(!editSong&&!pvId&&!dirty)reconcile()}).subscribe()}catch(e){}}
async function enter(u){const owner=store.get('rl-owner','');
if(owner&&owner!==u.id){wipeLocal();location.reload();return}
user=u;store.set('rl-owner',u.id);store.set('rl-email',u.email||'');

async function logout(){if(!confirm('Keluar dari akun ini? Data di perangkat ini akan dibersihkan, data kamu tetap aman di cloud.'))return;

/* UI login */
const aerr=(t,ok)=>{const e=$('aerr');e.textContent=t||'';e.classList.toggle('ok',!!ok)};
function emsg(e){const m=((e&&e.message)||'').toLowerCase();
if(m.includes('invalid login'))return'Email atau password salah.';
if(m.includes('not confirmed'))return'Email belum dikonfirmasi. Cek kotak masuk kamu.';
if(m.includes('already registered')||m.includes('already been registered'))return'Email ini sudah terdaftar. Silakan masuk.';
if(m.includes('at least')&&m.includes('character'))return'Password minimal 6 karakter.';
if(m.includes('same password'))return'Password baru harus berbeda dari yang lama.';
if(m.includes('rate limit')||m.includes('too many'))return'Terlalu banyak percobaan. Coba lagi beberapa menit lagi.';

function showAuth(m){amode=m;$('auth').hidden=false;document.body.style.overflow='hidden';
const rec=m==='recover',ld=m==='loading';
$('aform').hidden=ld;$('atabs').hidden=rec||ld;$('aload').hidden=!ld;$('aew').hidden=rec;
document.querySelectorAll('#atabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.m===m));
$('ap2w').classList.toggle('c',m==='login');
$('afor').classList.toggle('c',m!=='login');
$('abtn').textContent={login:'Masuk',register:'Daftar',recover:'Simpan password baru'}[m]||'Masuk';
$('aplb').textContent=rec?'Password baru':'Password';
$('ap').autocomplete=m==='login'?'current-password':'new-password';
$('asubt').textContent=rec?'Masukkan password baru untuk akunmu.':'Masuk untuk menyimpan lagu dan acara, tersinkron di semua perangkat.';
aerr('')}
function busy(b){authBusy=b;$('abtn').disabled=b;$('afor').disabled=b;document.querySelectorAll('#aform input').forEach(i=>i.disabled=b)}
$('atabs').onclick=e=>{const b=e.target.closest('button');if(b&&!authBusy)showAuth(b.dataset.m)};
$('ashow').onchange=e=>{$('ap').type=$('ap2').type=e.target.checked?'text':'password'};
$('aform').onsubmit=async e=>{e.preventDefault();if(authBusy||!sb)return;
const em=$('ae').value.trim(),pw=$('ap').value;aerr('');
if(amode!=='recover'&&!/^\S+@\S+\.\S+$/.test(em)){aerr('Masukkan email yang valid.');return}
if(pw.length<6){aerr('Password minimal 6 karakter.');return}
if(amode!=='login'&&pw!==$('ap2').value){aerr('Password dan ulangannya tidak sama.');return}
busy(true);
try{
if(amode==='login'){const{data,error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error)throw error;await enter(data.user)}
else if(amode==='register'){const{data,error}=await sb.auth.signUp({email:em,password:pw});if(error)throw error;
if(data.user&&data.user.identities&&!data.user.identities.length)throw{message:'already registered'};
if(data.session)await enter(data.user);
else{showAuth('login');$('ae').value=em;aerr('Pendaftaran berhasil. Cek email kamu untuk konfirmasi, lalu masuk.',1)}}
else{const{error}=await sb.auth.updateUser({password:pw});if(error)throw error;
const{data:{session}}=await sb.auth.getSession();if(session)await enter(session.user);else showAuth('login')}
}catch(err){aerr(emsg(err))}
busy(false)};
$('afor').onclick=async()=>{if(authBusy||!sb)return;const em=$('ae').value.trim();
if(!/^\S+@\S+\.\S+$/.test(em)){aerr('Isi email dulu, lalu tekan Lupa password.');return}

aerr(error?emsg(error):'Tautan reset password sudah dikirim ke email kamu.',!error)};
$('out').onclick=logout;
async function boot(){if(!sbOn)return;
if(!sb){sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
sb.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY')showAuth('recover');else if(ev==='SIGNED_OUT'&&user){user=null;showAuth('login')}});
onChange=touch}
showAuth('loading');
let session=null;try{session=(await sb.auth.getSession()).data.session}catch(e){}
if(REC&&session){showAuth('recover');return}
if(session)await enter(session.user);
else if(!navigator.onLine&&store.get('rl-owner','')){$('auth').hidden=true;document.body.style.overflow='';$('acct').hidden=false;$('who').textContent=store.get('rl-email','');setSt('Offline')}
else showAuth('login')}
addEventListener('online',()=>{if(sb)user?reconcile():boot()});
addEventListener('offline',()=>{if(user)setSt('Offline')});
document.addEventListener('visibilitychange',()=>{if(!user)return;if(document.visibilityState==='hidden'){if(dirty)pushNow()}else if(!dirty&&!editSong&&!pvId)reconcile()});

<script>
(function(){
const $=id=>document.getElementById(id),life=$('life'),cv=$('fx'),cx=cv.getContext('2d'),bgw=life.querySelector('.bgw'),spot=life.querySelector('.spot'),beat=life.querySelector('.beat'),rmq=matchMedia('(prefers-reduced-motion:reduce)'),root=document.documentElement;
let W=0,H=0,P=[],mx=.5,my=.5,sx=.5,sy=.5,tx=0,ttx=0,px=-999,py=-999,last=0,ema=16.7,fr=0,dead=false;
// glow digambar sekali ke sprite, lalu cuma di-copy tiap frame (jauh lebih murah)
function sprite(c){const s=document.createElement('canvas'),n=64,g=s.getContext('2d');s.width=s.height=n;const r=g.createRadialGradient(n/2,n/2,0,n/2,n/2,n/2);r.addColorStop(0,'rgba('+c+',.95)');r.addColorStop(.25,'rgba('+c+',.3)');r.addColorStop(1,'rgba('+c+',0)');g.fillStyle=r;g.fillRect(0,0,n,n);return s}
const SP=[sprite('255,206,140'),sprite('190,220,255')];

const off=()=>{spot.style.opacity=0;px=py=-999};addEventListener('pointerleave',off);addEventListener('touchend',off);
function lite(){dead=true;root.classList.add('lite');cx.clearRect(0,0,W,H)}
function loop(t){if(dead)return;requestAnimationFrame(loop);if(document.hidden||rmq.matches){last=0;return}
const dt=last?Math.min(t-last,100):16.7;last=t;const k=dt/16.7;

// parallax: satu transform langsung, tanpa CSS variable

if(Math.abs(dx)>.0004||Math.abs(dy)>.0004||Math.abs(dtx)>.05){sx+=dx*.05*k;sy+=dy*.05*k;tx+=dtx*.07*k;bgw.style.transform='translate3d('+(-(sx-.5)*28+tx).toFixed(1)+'px,'+(-(sy-.5)*16).toFixed(1)+'px,0)'}
if(px>-900)spot.style.transform='translate3d('+px.toFixed(0)+'px,'+py.toFixed(0)+'px,0)';

if(p.y<-20)p.y=H+20;if(p.x<-20)p.x=W+20;if(p.x>W+20)p.x=-20;

cx.globalAlpha=1}
requestAnimationFrame(loop);

window.lifePulse=acc=>{if(rmq.matches)return;beat.animate([{opacity:acc?.95:.5},{opacity:0}],{duration:acc?700:480,easing:'cubic-bezier(.2,.7,.3,1)'})};
// waktu: sapaan + warna suasana
const h=new Date().getHours(),part=h<4?'malam':h<11?'pagi':h<15?'siang':h<18?'sore':'malam',em={pagi:'🌅',siang:'☀️',sore:'🌇',malam:'🌙'}[part];
const sh=h>=19||h<4?[.46,.72]:h<11?[.18,.42]:h<18?[.26,.5]:[.34,.6];life.style.setProperty('--s1',sh[0]);life.style.setProperty('--s2',sh[1]);

document.addEventListener('pointerdown',e=>{const t=e.target.closest&&e.target.closest('.btn,.key,nav button,.st');if(!t||rmq.matches)return;const r=t.getBoundingClientRect(),z=Math.max(r.width,r.height)*2.2,i=document.createElement('i');i.className='rip';i.style.cssText='width:'+z+'px;height:'+z+'px;left:'+(e.clientX-r.left-z/2)+'px;top:'+(e.clientY-r.top-z/2)+'px';t.appendChild(i);setTimeout(()=>i.remove(),700)},{passive:true});
})();
